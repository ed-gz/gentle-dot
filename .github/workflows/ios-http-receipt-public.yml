name: Capri HTTP receipt fixture

# The URLProtocol fixture performs no network requests; no credentials, signing, IPA or artifacts.
on:
  push:
    branches:
      - fix/android-capri-motion-mobile
    paths:
      - .github/workflows/ios-http-receipt-public.yml

permissions: {}

jobs:
  receipt-fixture:
    if: github.repository == 'ed-gz/gentle-dot'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git -c credential.helper= fetch --depth=1 https://github.com/ed-gz/gentle-dot.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Compile and exercise receipt journal
        run: bash apps/ios/scripts/check-http-receipt.sh
