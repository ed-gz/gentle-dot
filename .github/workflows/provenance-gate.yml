name: Capri isolated provenance lease gate
on:
  push:
    branches: [capri-provenance-lease-gate-check]
permissions: {}
jobs:
  lease-gate:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Compile and run isolated Swift gate
        run: |
          clang -c validation/provenance/lease_lock.c -I validation/provenance/include -o "$RUNNER_TEMP/lease_lock.o"
          swiftc -I validation/provenance/include validation/provenance/ProvenanceLeaseGate.swift validation/provenance/main.swift "$RUNNER_TEMP/lease_lock.o" -o "$RUNNER_TEMP/capri-provenance-gate"
          "$RUNNER_TEMP/capri-provenance-gate"
