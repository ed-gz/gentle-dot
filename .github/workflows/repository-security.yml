name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          printf '%s\n' "$scanner_dir" >> "$GITHUB_PATH"
      - name: Test the publication guard and secret scanner
        run: node --test scripts/security/*.test.mjs
      - name: Check the index and reachable history
        run: |
          node scripts/security/check-repository.mjs
          node scripts/security/check-repository.mjs --history
      - name: Scan secrets in all fetched references
        run: sh scripts/security/check-secrets.sh
