name: Capri shared import recovery fixture

# Synthetic files only; no signing, IPA, personal art or credentials.
on:
  push:
    branches:
      - fix/android-capri-motion-mobile
    paths:
      - .github/workflows/ios-share-recovery-public.yml

permissions: {}

jobs:
  share-recovery:
    if: github.repository == 'ed-gz/gentle-dot'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git init .
          git -c credential.helper= fetch --depth=1 https://github.com/ed-gz/gentle-dot.git "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Compile and run native fixtures and typecheck the iOS bridge
        run: bash apps/ios/scripts/check-native-sdk.sh
