name: Capri unsigned iOS (SideStore)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capri-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Workspace tooling and dependencies
        run: |
          npm install --global pnpm@11.5.0
          # New workspace importer: resolve in this ephemeral runner; do not commit a lock rewrite.
          pnpm install --no-frozen-lockfile --ignore-scripts --filter @gentle-dot/ios...
      - name: Validate shell and workflow
        run: node --test apps/ios/test/config.test.mjs
      - name: Xcode project generator
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Rust and Tauri CLI
        run: |
          rustup target add aarch64-apple-ios
          cargo install tauri-cli --version 2.8.4 --locked --jobs 4
      - name: Build device app without signing or provisioning
        working-directory: apps/ios
        run: bash scripts/build-unsigned.sh
      - name: Upload unsigned IPA (SideStore signs on device)
        uses: actions/upload-artifact@v4
        with:
          name: Capri-unsigned-iphone
          path: apps/ios/out/Capri-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
