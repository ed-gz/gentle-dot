apply plugin: 'com.android.application'

android {
    namespace = "dev.gentledot.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.gentledot.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 47
        versionName "0.22.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig = true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                '--add-opens=java.base/java.util=ALL-UNNAMED',
                '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-opens=java.base/java.net=ALL-UNNAMED',
                '--add-opens=java.base/java.security=ALL-UNNAMED',
                '--add-opens=java.base/java.text=ALL-UNNAMED',
                '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
                '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
                '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:4.17"
    // Capacitor keeps Cordova as an implementation detail; tests that build a Bridge need its types.
    testImplementation "org.apache.cordova:framework:$cordovaAndroidVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// The overlay uses the exact PNG already packaged by Vite, avoiding a duplicate atlas copy.
def companionAssets = layout.buildDirectory.dir('generated/companion-assets')
def themeAssets = file('../../../../packages/theme-capri/src/assets')
def webAssets = file('src/main/assets/public/assets')
tasks.register('syncCompanionAssets') {
    inputs.files(fileTree(themeAssets) { include 'capri-motion-*-v1.json', 'capri-motion-*-v1.png' })
    inputs.files(fileTree(webAssets) { include 'capri-motion-*-v1-*.png' })
    outputs.dir(companionAssets)
    doLast {
        def output = companionAssets.get().dir('companion').asFile
        delete(companionAssets)
        output.mkdirs()
        ['core', 'actions', 'reactions', 'context', 'life', 'glimpses', 'friends'].each { name ->
            def stem = "capri-motion-${name}-v1"
            def images = fileTree(webAssets) { include "${stem}-*.png" }.files
            def manifest = new groovy.json.JsonSlurper().parse(new File(themeAssets, "${stem}.json"))
            if (images.size() == 1) {
                manifest.image = "public/assets/${images.first().name}"
            } else {
                // Native reactions must not depend on which animations Vite currently imports.
                copy { from new File(themeAssets, "${stem}.png"); into output }
                manifest.image = "companion/${stem}.png"
            }
            new File(output, "${stem}.json").text = groovy.json.JsonOutput.toJson(manifest)
        }
    }
}
android.sourceSets.main.assets.srcDir(companionAssets)
tasks.named('preBuild').configure { dependsOn 'syncCompanionAssets' }
