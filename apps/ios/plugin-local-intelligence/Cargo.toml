[package]
name = "tauri-plugin-local-intelligence"
version = "0.1.0"
edition = "2021"
publish = false
links = "tauri-plugin-local-intelligence"
description = "Capri on-device conversation through Apple's Foundation Models"

[dependencies]
tauri = { version = "2", default-features = false }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
