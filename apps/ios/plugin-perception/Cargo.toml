[package]
name = "tauri-plugin-perception"
version = "0.1.0"
edition = "2021"
publish = false
links = "tauri-plugin-perception"
description = "Capri offline push-to-talk and document perception using Apple Speech and Vision"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
